[package]
name = "veyra"
version = "0.8.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "veyra"
include = [
    "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "veyra.desktop",
    "src/**", "assets/**", "packaging/**", "scripts/*.sh", "scripts/*.py",
    ".github/workflows/*.yml", "docs/player.png", "docs/veyra-logo.svg", "docs/demo-cover.svg",
]

[[bin]]
name = "veyra"
path = "src/main.rs"

[[bin]]
name = "ym-export"
path = "src/bin/ym-export.rs"

[dependencies]
gtk = "0.18.2"
glib = "0.18.5"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
